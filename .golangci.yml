---
version: "2"
# Configure which files to skip during linting
run:
  tests: false

linters:
  default: all

  exclusions:
    paths:
      - "examples/"

  disable:
    - wsl
    - wsl_v5
    - nlreturn
    - depguard
    - gomodguard
    - gochecknoinits
    - gochecknoglobals
    - forbidigo
    - varnamelen
    - exhaustruct
    - exhaustruct_v5
    - noinlineerr
    - tagliatelle
    - nolintlint